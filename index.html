<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Precios y Reparaciones - TecnoServicios</title>
<style>
:root {
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --success: #10b981;
  --success-hover: #059669;
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --bg-main: #09090b; /* Fondo general negro oscuro */
  --card-bg: #18181b; /* Fondo de tarjetas oscuro */
  --text-main: #f8fafc; /* Texto principal claro */
  --text-muted: #94a3b8; /* Texto secundario gris */
  --border-color: #27272a; /* Bordes oscuros */
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 24px;
  background: var(--bg-main);
  color: var(--text-main);
}

.container {
  max-width: 1250px;
  margin: 0 auto;
  background: var(--card-bg);
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
  border: 1px solid var(--border-color);
}

.marca {
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 20px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

/* Contenedor del logo con sombreado blanco translúcido */
.logo {
  background: rgba(255, 255, 255, 0.08);
  padding: 12px 18px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo img {
  width: 130px;
  height: auto;
  object-fit: contain;
  display: block;
}

h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  color: #f1f5f9;
}
.lema {
  margin: 4px 0 0;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
}
.fecha-header {
  margin-left: auto;
  font-size: 13px;
  color: #cbd5e1;
  font-weight: 600;
  background: #27272a;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
}

form {
  background: #202024;
  padding: 24px;
  border-radius: 12px;
  margin-bottom: 24px;
  border: 1px solid var(--border-color);
  display: none;
  flex-direction: column;
  gap: 16px;
}
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
input, select, textarea {
  padding: 12px 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: #121214;
  color: #f8fafc;
  transition: all 0.2s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}
textarea {
  resize: vertical;
  height: 70px;
}

.seccion-reparaciones {
  display: none;
  background: #18181b;
  padding: 16px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
}
.seccion-reparaciones label.titulo-grupo {
  font-size: 12px;
  font-weight: 700;
  color: #94a3b8;
  display: block;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.checkbox-group {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  cursor: pointer;
  background: #202024;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  color: #cbd5e1;
}
.checkbox-item:hover {
  background: #27272a;
}
.checkbox-item input {
  cursor: pointer;
  width: 16px;
  height: 16px;
  accent-color: var(--primary);
}

.split-option {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #cbd5e1;
  background: #27272a;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
}
.split-option input {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  cursor: pointer;
}

button {
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: background 0.2s, transform 0.1s;
}
button:active {
  transform: scale(0.98);
}
#btnSubmit {
  background: var(--success);
  color: #fff;
  font-size: 15px;
}
#btnSubmit:hover {
  background: var(--success-hover);
}
button.mini {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 6px;
}
button.rojo {
  background: var(--danger);
  color: #fff;
}
button.rojo:hover {
  background: var(--danger-hover);
}

.search-box {
  width: 100%;
  padding: 14px 18px;
  margin-bottom: 16px;
  box-sizing: border-box;
  font-size: 15px;
  border: 2px solid var(--border-color);
  border-radius: 10px;
  background: #121214;
  color: #fff;
}
.search-box:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
  outline: none;
}
.barra {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.punto {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
  display: inline-block;
}
.punto.ok { background: var(--success); }
.punto.err { background: var(--danger); }

.table-responsive {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid var(--border-color);
}
table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
}
th, td {
  padding: 14px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
  font-size: 13px;
}
th {
  background: #202024;
  color: #f1f5f9;
  font-weight: 600;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.05em;
}
tr:nth-child(even) { background: #121214; }
tr:hover { background: #27272a; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.ganancia-txt { color: #34d399; font-weight: 700; }
.vacio { text-align: center; color: var(--text-muted); padding: 32px; font-style: italic; }

.admin-panel { display: none; }
.admin-link {
  margin-top: 24px;
  text-align: right;
  font-size: 13px;
}
.admin-link a {
  color: var(--text-muted);
  text-decoration: none;
  cursor: pointer;
  font-weight: 600;
}
.admin-link a:hover {
  color: #f8fafc;
  text-decoration: underline;
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(6px);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.modal-box {
  background: #18181b;
  border: 1px solid var(--border-color);
  padding: 28px;
  border-radius: 14px;
  width: 320px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
  text-align: center;
}
.modal-box h3 { margin-top: 0; color: #f8fafc; font-size: 18px; margin-bottom: 16px; }
.modal-box input { width: 100%; margin-bottom: 12px; box-sizing: border-box; text-align: center; font-size: 15px; }
.modal-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
.modal-buttons button { padding: 8px 16px; font-size: 13px; width: 100%; }
.btn-gris { background: #3f3f46; color: #fff; }
.btn-gris:hover { background: #52525b; }
</style>
</head>
<body>

<div class="container">
 <div class="marca">
  <div class="logo">
    <img src="logo.png" alt="LIFOX TECH" onerror="this.style.display='none'">
  </div>
  <div>
    <h1>Control de Precios y Reparaciones</h1>
    <p class="lema">Garantía, calidad y confianza</p>
  </div>
  <div id="fechaActual" class="fecha-header">Cargando fecha...</div>
</div>

  <form id="priceForm" class="admin-panel">
    <div class="form-row">
      <input type="text" id="clientName" placeholder="Nombre del Cliente" maxlength="80" required>

    <!-- DETALLES ESPECÍFICOS PARA IPHONE -->

        <select id="iphoneModel">

          <option value="iPhone 7">iPhone 7</option>
          <option value="iPhone 7 Plus">iPhone 7 Plus</option>
          <option value="iPhone 8">iPhone 8</option>
          <option value="iPhone 8 Plus">iPhone 8 Plus</option>
          <option value="iPhone X">iPhone X</option>
          <option value="iPhone XR">iPhone XR</option>
          <option value="iPhone XS">iPhone XS</option>
          <option value="iPhone XS Max">iPhone XS Max</option>
          <option value="iPhone 11">iPhone 11</option>
          <option value="iPhone 11 Pro">iPhone 11 Pro</option>
          <option value="iPhone 11 Pro Max">iPhone 11 Pro Max</option>
          <option value="iPhone SE (2ª gen)">iPhone SE (2ª gen)</option>

          <option value="iPhone 12 Pro Max">iPhone 12 Pro Max</option>
          <option value="iPhone 13">iPhone 13</option>
          <option value="iPhone 13 mini">iPhone 13 mini</option>
          <option value="iPhone 13 Pro">iPhone 13 Pro</option>
          <option value="iPhone 13 Pro Max">iPhone 13 Pro Max</option>
          <option value="iPhone SE (3ª gen)">iPhone SE (3ª gen)</option>
          <option value="iPhone 14">iPhone 14</option>
          <option value="iPhone 14 Plus">iPhone 14 Plus</option>
          <option value="iPhone 14 Pro">iPhone 14 Pro</option>
          <option value="iPhone 14 Pro Max">iPhone 14 Pro Max</option>
          <option value="iPhone 15">iPhone 15</option>
          <option value="iPhone 15 Plus">iPhone 15 Plus</option>
          <option value="iPhone 15 Pro">iPhone 15 Pro</option>
          <option value="iPhone 15 Pro Max">iPhone 15 Pro Max</option>
          <option value="iPhone 16">iPhone 16</option>
          <option value="iPhone 16 Plus">iPhone 16 Plus</option>
          <option value="iPhone 16 Pro">iPhone 16 Pro</option>
          <option value="iPhone 16 Pro Max">iPhone 16 Pro Max</option>
        </select>

        <select id="iphoneColor">
          <option value="" style="background:#18181b;">Seleccione Color</option>
          <option value="Negro / Space Gray">Negro / Space Gray</option>
          <option value="Blanco / Silver">Blanco / Silver</option>
          <option value="Dorado / Gold">Dorado / Gold</option>
          <option value="Rosado / Rose Gold">Rosado / Rose Gold</option>
          <option value="Rojo / Product RED">Rojo / Product RED</option>
          <option value="Azul / Blue">Azul / Blue</option>
          <option value="Verde / Green">Verde / Green</option>
          <option value="Morado / Purple">Morado / Purple</option>
          <option value="Titanio Natural">Titanio Natural</option>
          <option value="Titanio Desierto">Titanio Desierto</option>
          <option value="Otro">Otro</option>
        </select>

        <select id="iphoneStorage">
          <option value="" style="background:#18181b;">Capacidad</option>
          <option value="16GB">16 GB</option>
          <option value="32GB">32 GB</option>
          <option value="64GB">64 GB</option>
          <option value="128GB">128 GB</option>
          <option value="256GB">256 GB</option>
          <option value="512GB">512 GB</option>
          <option value="1TB">1 TB</option>
        </select>
      </div>
    </div>

    <!-- CAMPO PARA MODELO ANDROID -->
    <div id="seccionAndroidSpecs" class="seccion-reparaciones" style="display:none; background:#121214;">
      <label class="titulo-grupo">Modelo de Dispositivo Android:</label>
      <input type="text" id="androidModel" placeholder="Ej. Samsung Galaxy S23, Xiaomi Redmi Note 12...">
    </div>

    <!-- DETALLES ESPECÍFICOS PARA COMPUTADORAS / LAPTOPS -->
    <div id="seccionPCSpecs" class="seccion-reparaciones" style="display:none; background:#121214;">
      <label class="titulo-grupo">Especificaciones de la Computadora / Laptop:</label>
      <div class="form-row" style="margin-bottom: 10px;">
        <input type="text" id="pcModel" placeholder="Modelo (Ej. HP Pavilion, Lenovo ThinkPad, iMac...)">
        <select id="pcColor">
          <option value="" style="background:#18181b;">Seleccione Color</option>
          <option value="Negro">Negro</option>
          <option value="Plateado / Gris / Silver">Plateado / Gris / Silver</option>
          <option value="Blanco">Blanco</option>
          <option value="Azul">Azul</option>
          <option value="Rojo">Rojo</option>
          <option value="Rosado">Rosado</option>
          <option value="Dorado / Gold">Dorado / Gold</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
    </div>

    <div id="seccionMovil" class="seccion-reparaciones">
      <label class="titulo-grupo">Servicios para Móviles:</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de pantalla"> Cambio de pantalla</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de flex"> Cambio de flex</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de bocina"> Cambio de bocina</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de cristal trasero"> Cambio de cristal trasero</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de cristal de cámara"> Cambio de cristal de cámara</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de software"> Cambio de software</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Desbloqueo de red"> Desbloqueo de red</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Desbloqueo de iCloud"> Desbloqueo de iCloud</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Activación de turbo sim en iPhone"> Activación de turbo sim en iPhone</label>
      </div>
    </div>

    <div id="seccionPC" class="seccion-reparaciones">
      <label class="titulo-grupo">Servicios / Reparaciones de Computadoras:</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Instalación de Windows"> Instalación de Windows</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Instalación de paquete de office"> Instalación de Office</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de Software"> Cambio de Software</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Colocación de pasta térmica"> Pasta térmica</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Desbloqueo"> Desbloqueo</label>
      </div>
    </div>

    <!-- OPCIÓN DE DIVISIÓN DE GANANCIA 50/50 -->
    <div class="form-row">
      <label class="split-option">
        <input type="checkbox" id="splitProfit"> Dividir ganancia 50/50 (Servicio de un solo precio)
      </label>
    </div>

    <div class="form-row">
      <input type="number" id="itemCompra" placeholder="Precio Compra ($)" step="0.01" min="0" required>
      <input type="number" id="itemCliente" placeholder="Precio Cliente ($)" step="0.01" min="0" required>
    </div>

    <textarea id="itemNote" placeholder="Nota sobre el dispositivo (Ej. Contraseña, rayones, accesorios incluidos...)"></textarea>

    <button type="submit" id="btnSubmit">Registrar en la Nube</button>

  <input type="text" id="searchBox" class="search-box" placeholder="🔍 Buscar por cliente, teléfono, dispositivo, reparación o notas...">

  <div class="barra">
    <span class="punto" id="punto"></span>
    <span id="loadingStatus">Cargando registros...</span>
    <button type="button" class="mini" id="btnReload" style="background:#3f3f46; color:#fff;">Actualizar ahora</button>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Dispositivo</th>
          <th>Reparaciones / Servicios</th>

          <th class="num">Cliente</th>
          <th class="num">Ganancia</th>
          <th>Nota</th>
          <th>Fecha / Hora</th>
          <th class="col-admin admin-panel" style="width: 100px; text-align:center;">Acciones</th>
        </tr>
      </thead>
      <tbody id="inventoryTable"></tbody>
    </table>

    <a id="btnAdminLogin" onclick="toggleAdmin()">🔐 Modo Administrador</a>
  </div>

<!-- MODAL DE LOGIN (USUARIO Y CONTRASEÑA) -->
<div id="adminModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Acceso de Administrador</h3>
    <input type="text" id="adminUserInput" placeholder="Usuario (Ej. admin)">
    <input type="password" id="adminPasswordInput" placeholder="Contraseña">
    <div class="modal-buttons">
      <button type="button" onclick="verificarPassword()">Ingresar</button>
      <button type="button" class="btn-gris" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbycBCLYcUhsjIQzA6LIQeVjPxUSYbJD4KCYp3DqrvPNSHZtHZABj_Gfl_oqHUu8sCKaqQ/exec";

const priceForm = document.getElementById('priceForm');
const inventoryTable = document.getElementById('inventoryTable');
const searchBox = document.getElementById('searchBox');
const loadingStatus = document.getElementById('loadingStatus');
const punto = document.getElementById('punto');
const btnSubmit = document.getElementById('btnSubmit');
const fechaActual = document.getElementById('fechaActual');
const adminModal = document.getElementById('adminModal');
const adminUserInput = document.getElementById('adminUserInput');
const adminPasswordInput = document.getElementById('adminPasswordInput');

const deviceCategory = document.getElementById('deviceCategory');
const seccionOS = document.getElementById('seccionOS');
const mobileOS = document.getElementById('mobileOS');
const seccionIphoneSpecs = document.getElementById('seccionIphoneSpecs');
const seccionAndroidSpecs = document.getElementById('seccionAndroidSpecs');
const seccionPCSpecs = document.getElementById('seccionPCSpecs');
const seccionMovil = document.getElementById('seccionMovil');
const seccionPC = document.getElementById('seccionPC');
const splitProfitCheckbox = document.getElementById('splitProfit');
const itemCompraInput = document.getElementById('itemCompra');
const itemClienteInput = document.getElementById('itemCliente');

let inventory = [];
let isAdmin = sessionStorage.getItem('isAdmin') === 'true';

// Lógica para manejar el check de 50/50
splitProfitCheckbox.addEventListener('change', () => {
  if (splitProfitCheckbox.checked) {
    itemCompraInput.value = '0';
    itemCompraInput.disabled = true;
    itemCompraInput.style.background = '#27272a';
  } else {
    itemCompraInput.value = '';
    itemCompraInput.disabled = false;
    itemCompraInput.style.background = '#121214';
  }
});

deviceCategory.addEventListener('change', () => {
  const val = deviceCategory.value;
  seccionOS.style.display = 'none';
  seccionIphoneSpecs.style.display = 'none';
  seccionAndroidSpecs.style.display = 'none';
  seccionPCSpecs.style.display = 'none';
  seccionMovil.style.display = 'none';
  seccionPC.style.display = 'none';
  mobileOS.value = '';
  document.querySelectorAll('input[name="rep"]').forEach(cb => cb.checked = false);

  if (val === 'movil') {
    seccionOS.style.display = 'block';
  } else if (val === 'pc') {
    seccionPCSpecs.style.display = 'block';
    seccionPC.style.display = 'block';
  }
});

mobileOS.addEventListener('change', () => {
  const os = mobileOS.value;
  seccionIphoneSpecs.style.display = 'none';
  seccionAndroidSpecs.style.display = 'none';
  seccionMovil.style.display = 'none';

  if (os === 'iPhone') {
    seccionIphoneSpecs.style.display = 'block';
    seccionMovil.style.display = 'block';
  } else if (os === 'Android') {
    seccionAndroidSpecs.style.display = 'block';
    seccionMovil.style.display = 'block';
  }
});

function verificarAdminUI() {
  const elms = document.querySelectorAll('.admin-panel');
  elms.forEach(el => {
    if (el.tagName === 'FORM') {
      el.style.display = isAdmin ? 'flex' : 'none';
    } else {
      el.style.display = isAdmin ? 'table-cell' : 'none';
    }
  });
  const btnLogin = document.getElementById('btnAdminLogin');
  if (btnLogin) btnLogin.textContent = isAdmin ? '🔓 Cerrar Sesión Admin' : '🔐 Modo Administrador';
}

function toggleAdmin() {
  if (isAdmin) {
    sessionStorage.removeItem('isAdmin');
    isAdmin = false;
    verificarAdminUI();
    displayItems(searchBox.value);
  } else {
    adminModal.style.display = 'flex';
    adminUserInput.value = '';
    adminPasswordInput.value = '';
    adminUserInput.focus();
  }
}

function cerrarModal() { adminModal.style.display = 'none'; }

// Verificación segura de usuario y contraseña en el servidor
async function verificarPassword() {
  const usuarioIngresado = adminUserInput.value.trim();
  const passIngresada = adminPasswordInput.value;
  if (!usuarioIngresado || !passIngresada) return;

  try {
    estado('ok', 'Verificando credenciales...');
    const res = await fetch(`${WEB_APP_URL}?action=verifyAdmin&user=${encodeURIComponent(usuarioIngresado)}&pass=${encodeURIComponent(passIngresada)}&t=${Date.now()}`);
    const data = await res.json();

    if (data.success) {
      sessionStorage.setItem('isAdmin', 'true');
      isAdmin = true;
      verificarAdminUI();
      displayItems(searchBox.value);
      cerrarModal();
      estado('ok', 'Acceso concedido');
    } else {
      alert('Usuario o contraseña incorrectos.');
      adminPasswordInput.value = '';
      adminPasswordInput.focus();
      estado('ok', 'Sincronizado');
    }
  } catch (err) {
    alert('Error al conectar con la nube para verificar credenciales.');
    estado('err', 'Error de conexión');
  }
}

adminPasswordInput.addEventListener('keypress', e => { if (e.key === 'Enter') verificarPassword(); });
adminUserInput.addEventListener('keypress', e => { if (e.key === 'Enter') adminPasswordInput.focus(); });

function mostrarFecha() {
  try {
    if (!fechaActual) return;
    const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const textoFecha = new Date().toLocaleDateString('es-DO', opciones);
    fechaActual.textContent = textoFecha.charAt(0).toUpperCase() + textoFecha.slice(1);
  } catch(e) {
    fechaActual.textContent = "Fecha actual";
  }
}

const money = n => '$' + Number(n || 0).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function estado(cls, txt) { punto.className = 'punto '+cls; loadingStatus.textContent = txt; }

async function loadInventory() {
  try {
    const r = await fetch(WEB_APP_URL+'?t='+Date.now(),{cache:'no-store'});
    const data = await r.json();
    inventory = Array.isArray(data)?data:[];
    displayItems(searchBox.value);
    estado('ok','Sincronizado · '+new Date().toLocaleTimeString('es-DO'));
  } catch(e) {
    estado('err','Sin conexión con la nube');
  }
}

function displayItems(filter=''){
  const f = filter.trim().toLowerCase();
  inventoryTable.innerHTML='';
  const lista = inventory.filter(it=>!f || String(it.client).toLowerCase().includes(f) || String(it.phone).toLowerCase().includes(f) || String(it.name).toLowerCase().includes(f) || String(it.type).toLowerCase().includes(f) || String(it.note).toLowerCase().includes(f));
  
  const totalCols = isAdmin ? 10 : 9;

  if(!lista.length){
    inventoryTable.innerHTML='<tr><td colspan="'+totalCols+'" class="vacio">'+(f?'Sin coincidencias.':'Aún no hay registros guardados.')+'</td></tr>';
    return;
  }
  
  lista.sort((a,b)=>String(a.client).localeCompare(String(b.client),'es'));
  lista.forEach(it=>{
    const tr=document.createElement('tr');
    let html='<td><strong>'+esc(it.client)+'</strong></td>'+
      '<td>'+esc(it.phone || '-')+'</td>'+
      '<td>'+esc(it.name)+'</td>'+
      '<td>'+esc(it.type)+'</td>'+
      '<td class="num">'+money(it.pCompra)+'</td>'+
      '<td class="num">'+money(it.pCliente)+'</td>'+
      '<td class="num ganancia-txt">'+money(it.profit)+'</td>'+
      '<td>'+esc(it.note || '-')+'</td>'+
      '<td>'+esc(it.date)+' <br><small style="color:#94a3b8">'+esc(it.time)+'</small></td>';
    
    if(isAdmin){
      html+='<td style="white-space:nowrap; text-align:center;">'+
        '<button class="mini" data-edit="'+esc(it.id)+'" data-compra="'+it.pCompra+'" data-cliente="'+it.pCliente+'" style="background:#3b82f6; color:#fff;">Editar</button> '+
        '<button class="mini rojo" data-del="'+esc(it.id)+'">Borrar</button></td>';
    }
    
    tr.innerHTML=html;
    inventoryTable.appendChild(tr);
  });
}

priceForm.addEventListener('submit', async e => {
  e.preventDefault();
  if(!isAdmin) return;
  
  const client = document.getElementById('clientName').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const category = deviceCategory.value;
  
  let deviceName = '';
  if (category === 'pc') {
    const pcMod = document.getElementById('pcModel').value.trim();
    const pcCol = document.getElementById('pcColor').value;
    if(!pcMod || !pcCol) {
      alert('Por favor ingrese el modelo y el color de la computadora / laptop.');
      return;
    }
    deviceName = `${pcMod} (${pcCol})`;
  } else if (category === 'movil') {
    const os = mobileOS.value;
    if (os === 'iPhone') {
      const mod = document.getElementById('iphoneModel').value;
      const col = document.getElementById('iphoneColor').value;
      const sto = document.getElementById('iphoneStorage').value;
      if(!mod || !col || !sto) {
        alert('Por favor complete las especificaciones del iPhone (Modelo, Color y Capacidad).');
        return;
      }
      deviceName = `${mod} (${col}, ${sto})`;
    } else if (os === 'Android') {
      const andMod = document.getElementById('androidModel').value.trim();
      if(!andMod) {
        alert('Por favor escriba el modelo del dispositivo Android.');
        return;
      }
      deviceName = andMod;
    } else {
      alert('Seleccione si es iPhone o Android.');
      return;
    }
  }

  let pCompra = splitProfitCheckbox.checked ? 0 : Number(itemCompraInput.value);
  let pCliente = Number(itemClienteInput.value);
  let profit = pCliente - pCompra;

  if (splitProfitCheckbox.checked) {
    profit = pCliente / 2;
  }

  const note = document.getElementById('itemNote').value.trim();

  const checkboxes = document.querySelectorAll('input[name="rep"]:checked');
  const seleccionadas = Array.from(checkboxes).map(cb => cb.value);
  
  if(seleccionadas.length === 0) {
    alert('Por favor seleccione al menos una reparación o servicio.');
    return;
  }

  const typeStr = seleccionadas.join(', ');

  const ahora = new Date();
  const tempId = 'temp_' + Date.now();
  const nuevoItem = {
    id: tempId,
    client: client,
    phone: phone,
    name: deviceName,
    type: typeStr,
    pCompra: pCompra,
    pCliente: pCliente,
    profit: profit,
    note: note,
    date: ahora.toLocaleDateString('es-DO'),
    time: ahora.toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit', second: '2-digit' })
  };

  inventory.unshift(nuevoItem);
  displayItems(searchBox.value);
  priceForm.reset();
  splitProfitCheckbox.checked = false;
  itemCompraInput.disabled = false;
  itemCompraInput.style.background = '#121214';
  seccionOS.style.display = 'none';
  seccionIphoneSpecs.style.display = 'none';
  seccionAndroidSpecs.style.display = 'none';
  seccionPCSpecs.style.display = 'none';
  seccionMovil.style.display = 'none';
  seccionPC.style.display = 'none';
  estado('ok', 'Guardado (Sincronizando...)');

  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ client, phone, name: deviceName, type: typeStr, pCompra, pCliente, note })
    });
    setTimeout(loadInventory, 1000);
  } catch(err) {
    estado('err', 'Error al sincronizar con la nube');
  }
});

inventoryTable.addEventListener('click', async e => {
  if(!isAdmin) return;
  const del = e.target.closest('button[data-del]');
  const ed = e.target.closest('button[data-edit]');
  
  if(del) {
    if(!confirm('¿Borrar este registro?')) return;
    estado('ok', 'Eliminando...');
    try {
      await fetch(WEB_APP_URL+'?action=delete&id='+encodeURIComponent(del.dataset.del)+'&t='+Date.now());
      estado('ok', 'Registro borrado');
      setTimeout(loadInventory, 400);
    } catch(err) { estado('err', 'No se pudo borrar'); }
  }

  if(ed) {
    const cAct = Number(ed.dataset.compra);
    const cliAct = Number(ed.dataset.cliente);
    const nCompra = prompt('Nuevo Precio Compra:', cAct.toFixed(2));
    if(nCompra === null) return;
    const nCliente = prompt('Nuevo Precio Cliente:', cliAct.toFixed(2));
    if(nCliente === null) return;

    const nc = Number(nCompra), ncl = Number(nCliente);
    if(isNaN(nc) || isNaN(ncl)) { alert('Valores inválidos'); return; }

    estado('ok', 'Actualizando precios...');
    try {
      await fetch(WEB_APP_URL+'?action=update&id='+encodeURIComponent(ed.dataset.edit)+'&pCompra='+nc+'&pCliente='+ncl+'&t='+Date.now());
      estado('ok', 'Precios actualizados');
      setTimeout(loadInventory, 400);
    } catch(err) { estado('err', 'No se pudo actualizar'); }
  }
});

searchBox.addEventListener('input', e => displayItems(e.target.value));
document.getElementById('btnReload').addEventListener('click', loadInventory);

verificarAdminUI();
mostrarFecha();
loadInventory();

setInterval(() => { if(!document.hidden) loadInventory(); }, 15000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) loadInventory(); });
</script>
</body>
</html>
