<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Precios y Reparaciones - TecnoServicios</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f9;color:#333}
h1{color:#1a252f;font-size:22px}
.container{max-width:1200px;margin:0 auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
form{background:#eef2f7;padding:15px;border-radius:6px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
input,select,textarea,button{padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:inherit}
textarea{resize:vertical;height:60px}
button{background:#2ecc71;color:#fff;border:none;cursor:pointer;font-weight:bold}
button:hover{background:#27ae60}
button:disabled{background:#95a5a6;cursor:wait}
button.mini{padding:5px 9px;font-size:12px}
button.rojo{background:#e74c3c}
button.rojo:hover{background:#c0392b}

/* Estilos para el contenedor de opciones dinámicas */
.checkbox-group{background:#fff;padding:10px;border:1px solid #ccc;border-radius:4px;max-height:160px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.seccion-reparaciones{display:none;background:#fdfefe;padding:10px;border:1px dashed #bdc3c7;border-radius:4px}

.search-box{width:100%;padding:10px;margin-bottom:12px;box-sizing:border-box;font-size:16px;border:2px solid #2ecc71;border-radius:4px}
.barra{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:#7f8c8d;flex-wrap:wrap}
.punto{width:9px;height:9px;border-radius:50%;background:#95a5a6;display:inline-block}
.punto.ok{background:#2ecc71}.punto.err{background:#e74c3c}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd;font-size:13px}
th{background:#34495e;color:#fff}
tr:hover{background:#f1f1f1}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ganancia-txt{color:#27ae60;font-weight:bold}
.vacio{text-align:center;color:#7f8c8d;padding:24px}
@media(max-width:600px){body{margin:8px}.container{padding:12px}}
.marca{display:flex;align-items:center;gap:14px;border-bottom:2px solid #2ecc71;padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.logo img{width:155px;height:104px;margin:-27px 0 0 -28px;max-width:none;display:block}
.lema{margin:3px 0 0;font-size:12px;color:#7f8c8d;text-transform:uppercase;letter-spacing:.06em}
.fecha-header{margin-left:auto;font-size:13px;color:#2c3e50;font-weight:bold;background:#eef2f7;padding:6px 12px;border-radius:6px;border:1px solid #dcdde1}
.admin-panel{display:none}
.admin-link{margin-top:20px;text-align:right;font-size:12px}
.admin-link a{color:#7f8c8d;text-decoration:none;cursor:pointer}
.admin-link a:hover{color:#333;text-decoration:underline}

.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000}
.modal-box{background:#fff;padding:20px;border-radius:8px;width:300px;box-shadow:0 4px 8px rgba(0,0,0,0.2);text-align:center}
.modal-box h3{margin-top:0;color:#2c3e50;font-size:16px}
.modal-box input{width:80%;margin-bottom:12px;padding:8px;font-size:16px;text-align:center}
.modal-buttons{display:flex;justify-content:center;gap:10px}
.modal-buttons button{padding:6px 12px;font-size:13px}
.btn-gris{background:#95a5a6}
.btn-gris:hover{background:#7f8c8d}
</style>
</head>
<body>

<div class="container">
 <div class="marca">
  <div class="logo"><img src="logo.png" alt="LIFOX TECH"></div>
  <div>
    <h1>Control de Precios y Reparaciones</h1>
    <p class="lema">Garantía, calidad y confianza</p>
  </div>
  <div id="fechaActual" class="fecha-header">Cargando fecha...</div>
</div>

  <!-- Formulario de Registro con selección de dispositivo -->
  <form id="priceForm" class="admin-panel">
    <div class="form-row">
      <input type="text" id="clientName" placeholder="Nombre del Cliente" maxlength="80" required>
      <input type="text" id="itemName" placeholder="Modelo del Dispositivo (Ej. iPhone 13, HP Pavilion)" maxlength="80" required>
    </div>

    <div class="form-row">
      <select id="deviceCategory" required>
        <option value="">Seleccione Tipo de Dispositivo</option>
        <option value="movil">📱 Dispositivo Móvil (iPhone / Android)</option>
        <option value="pc">💻 Computadora / Laptop (PC)</option>
      </select>
    </div>

    <!-- Sección que aparece dinámicamente según el dispositivo -->
    <div id="seccionMovil" class="seccion-reparaciones">
      <label style="font-size:12px;font-weight:bold;color:#34495e;display:block;margin-bottom:6px;">Servicios para Móviles:</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de pantalla"> Cambio de pantalla</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de flex"> Cambio de flex</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de bocina"> Cambio de bocina</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de cristal trasero"> Cambio de cristal trasero</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de cristal de cámara"> Cambio de cristal de cámara</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Microsoldadura"> Microsoldadura</label>
      </div>
    </div>

    <div id="seccionPC" class="seccion-reparaciones">
      <label style="font-size:12px;font-weight:bold;color:#34495e;display:block;margin-bottom:6px;">Servicios para Computadoras / Laptops:</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Instalación de Windows"> Instalación de Windows</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Instalación de paquete de office"> Instalación de Office</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Cambio de Software"> Cambio de Software</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Colocación de pasta térmica"> Pasta térmica</label>
        <label class="checkbox-item"><input type="checkbox" name="rep" value="Microsoldadura"> Microsoldadura</label>
      </div>
    </div>

    <div class="form-row">
      <input type="number" id="itemCompra" placeholder="Precio Compra ($)" step="0.01" min="0" required>
      <input type="number" id="itemCliente" placeholder="Precio Cliente ($)" step="0.01" min="0" required>
    </div>

    <textarea id="itemNote" placeholder="Nota sobre el dispositivo (Ej. Contraseña, rayones, accesorios incluidos...)"></textarea>

    <button type="submit" id="btnSubmit">Registrar en la Nube</button>
  </form>

  <input type="text" id="searchBox" class="search-box" placeholder="🔍 Buscar por cliente, dispositivo, reparación o notas...">

  <div class="barra">
    <span class="punto" id="punto"></span>
    <span id="loadingStatus">Cargando registros...</span>
    <button type="button" class="mini" id="btnReload">Actualizar ahora</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Cliente</th>
        <th>Dispositivo</th>
        <th>Reparaciones / Servicios</th>
        <th class="num">Compra</th>
        <th class="num">Cliente</th>
        <th class="num">Ganancia</th>
        <th>Nota</th>
        <th>Fecha / Hora</th>
        <th class="col-admin admin-panel" style="width: 100px;"></th>
      </tr>
    </thead>
    <tbody id="inventoryTable"></tbody>
  </table>

  <div class="admin-link">
    <a id="btnAdminLogin" onclick="toggleAdmin()">🔐 Modo Administrador</a>
  </div>
</div>

<div id="adminModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Acceso de Administrador</h3>
    <input type="password" id="adminPasswordInput" placeholder="Contraseña">
    <div class="modal-buttons">
      <button type="button" onclick="verificarPassword()">Ingresar</button>
      <button type="button" class="btn-gris" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbycBCLYcUhsjIQzA6LIQeVjPxUSYbJD4KCYp3DqrvPNSHZtHZABj_Gfl_oqHUu8sCKaqQ/exec";
const ADMIN_PASSWORD = "199926"; 

const priceForm = document.getElementById('priceForm');
const inventoryTable = document.getElementById('inventoryTable');
const searchBox = document.getElementById('searchBox');
const loadingStatus = document.getElementById('loadingStatus');
const punto = document.getElementById('punto');
const btnSubmit = document.getElementById('btnSubmit');
const fechaActual = document.getElementById('fechaActual');
const adminModal = document.getElementById('adminModal');
const adminPasswordInput = document.getElementById('adminPasswordInput');
const deviceCategory = document.getElementById('deviceCategory');
const seccionMovil = document.getElementById('seccionMovil');
const seccionPC = document.getElementById('seccionPC');

let inventory = [];
let isAdmin = sessionStorage.getItem('isAdmin') === 'true';

// Mostrar u ocultar opciones de reparaciones según el tipo de dispositivo elegido
deviceCategory.addEventListener('change', () => {
  const val = deviceCategory.value;
  seccionMovil.style.display = 'none';
  seccionPC.style.display = 'none';

  // Desmarcar todas al cambiar de categoría
  document.querySelectorAll('input[name="rep"]').forEach(cb => cb.checked = false);

  if (val === 'movil') {
    seccionMovil.style.display = 'block';
  } else if (val === 'pc') {
    seccionPC.style.display = 'block';
  }
});

function verificarAdminUI() {
  const elementosAdmin = document.querySelectorAll('.admin-panel');
  elementosAdmin.forEach(el => {
    el.style.display = isAdmin ? (el.tagName === 'FORM' ? 'flex' : 'table-cell') : 'none';
  });
  document.getElementById('btnAdminLogin').textContent = isAdmin ? '🔓 Cerrar Sesión Admin' : '🔐 Modo Administrador';
}

function toggleAdmin() {
  if (isAdmin) {
    sessionStorage.removeItem('isAdmin');
    isAdmin = false;
    verificarAdminUI();
    displayItems(searchBox.value);
    alert('Sesión de administrador cerrada.');
  } else {
    adminModal.style.display = 'flex';
    adminPasswordInput.value = '';
    adminPasswordInput.focus();
  }
}

function cerrarModal() { adminModal.style.display = 'none'; }

function verificarPassword() {
  if (adminPasswordInput.value === ADMIN_PASSWORD) {
    sessionStorage.setItem('isAdmin', 'true');
    isAdmin = true;
    verificarAdminUI();
    displayItems(searchBox.value);
    cerrarModal();
    alert('¡Modo administrador activado!');
  } else {
    alert('Contraseña incorrecta.');
    adminPasswordInput.value = '';
    adminPasswordInput.focus();
  }
}

adminPasswordInput.addEventListener('keypress', e => { if (e.key === 'Enter') verificarPassword(); });

function mostrarFecha() {
  if (!fechaActual) return;
  const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  fechaActual.textContent = new Date().toLocaleDateString('es-DO', opciones);
}

const money = n => '$' + Number(n || 0).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function estado(cls, txt) { punto.className = 'punto '+cls; loadingStatus.textContent = txt; }

async function loadInventory() {
  try {
    const r = await fetch(WEB_APP_URL+'?t='+Date.now(),{cache:'no-store'});
    const data = await r.json();
    inventory = Array.isArray(data)?data:[];
    displayItems(searchBox.value);
    estado('ok','🟢 Sincronizado · '+new Date().toLocaleTimeString('es-DO'));
  } catch(e) {
    estado('err','❌ Sin conexión con la nube');
  }
}

function displayItems(filter=''){
  const f = filter.trim().toLowerCase();
  inventoryTable.innerHTML='';
  const lista = inventory.filter(it=>!f || String(it.client).toLowerCase().includes(f) || String(it.name).toLowerCase().includes(f) || String(it.type).toLowerCase().includes(f) || String(it.note).toLowerCase().includes(f));
  
  const totalCols = isAdmin ? 9 : 8;

  if(!lista.length){
    inventoryTable.innerHTML='<tr><td colspan="'+totalCols+'" class="vacio">'+(f?'Sin coincidencias.':'Aún no hay registros guardados.')+'</td></tr>';
    return;
  }
  
  lista.sort((a,b)=>String(a.client).localeCompare(String(b.client),'es'));
  lista.forEach(it=>{
    const tr=document.createElement('tr');
    let html='<td><strong>'+esc(it.client)+'</strong></td>'+
      '<td>'+esc(it.name)+'</td>'+
      '<td>'+esc(it.type)+'</td>'+
      '<td class="num">'+money(it.pCompra)+'</td>'+
      '<td class="num">'+money(it.pCliente)+'</td>'+
      '<td class="num ganancia-txt">'+money(it.profit)+'</td>'+
      '<td>'+esc(it.note || '-')+'</td>'+
      '<td>'+esc(it.date)+' <br><small style="color:#7f8c8d">'+esc(it.time)+'</small></td>';
    
    if(isAdmin){
      html+='<td style="white-space:nowrap">'+
        '<button class="mini" data-edit="'+esc(it.id)+'" data-compra="'+it.pCompra+'" data-cliente="'+it.pCliente+'">Editar</button> '+
        '<button class="mini rojo" data-del="'+esc(it.id)+'">Borrar</button></td>';
    }
    
    tr.innerHTML=html;
    inventoryTable.appendChild(tr);
  });
}

priceForm.addEventListener('submit', async e => {
  e.preventDefault();
  if(!isAdmin) return;
  
  const client = document.getElementById('clientName').value.trim();
  const name = document.getElementById('itemName').value.trim();
  const pCompra = Number(document.getElementById('itemCompra').value);
  const pCliente = Number(document.getElementById('itemCliente').value);
  const note = document.getElementById('itemNote').value.trim();

  // Recolectar checkboxes seleccionados que estén visibles
  const checkboxes = document.querySelectorAll('input[name="rep"]:checked');
  const seleccionadas = Array.from(checkboxes).map(cb => cb.value);
  
  if(seleccionadas.length === 0) {
    alert('Por favor seleccione al menos una reparación o servicio.');
    return;
  }

  const typeStr = seleccionadas.join(', ');
  const profit = pCliente - pCompra;

  const ahora = new Date();
  const tempId = 'temp_' + Date.now();
  const nuevoItem = {
    id: tempId,
    client: client,
    name: name,
    type: typeStr,
    pCompra: pCompra,
    pCliente: pCliente,
    profit: profit,
    note: note,
    date: ahora.toLocaleDateString('es-DO'),
    time: ahora.toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit', second: '2-digit' })
  };

  inventory.unshift(nuevoItem);
  displayItems(searchBox.value);
  priceForm.reset();
  seccionMovil.style.display = 'none';
  seccionPC.style.display = 'none';
  estado('ok', '⚡ Guardado (Sincronizando...)');

  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ client, name, type: typeStr, pCompra, pCliente, note })
    });
    setTimeout(loadInventory, 1000);
  } catch(err) {
    estado('err', '❌ Error al sincronizar con la nube');
  }
});

inventoryTable.addEventListener('click', async e => {
  if(!isAdmin) return;
  const del = e.target.closest('button[data-del]');
  const ed = e.target.closest('button[data-edit]');
  
  if(del) {
    if(!confirm('¿Borrar este registro?')) return;
    estado('ok', 'Eliminando...');
    try {
      await fetch(WEB_APP_URL+'?action=delete&id='+encodeURIComponent(del.dataset.del)+'&t='+Date.now());
      estado('ok', 'Registro borrado');
      setTimeout(loadInventory, 400);
    } catch(err) { estado('err', '❌ No se pudo borrar'); }
  }

  if(ed) {
    const cAct = Number(ed.dataset.compra);
    const cliAct = Number(ed.dataset.cliente);
    const nCompra = prompt('Nuevo Precio Compra:', cAct.toFixed(2));
    if(nCompra === null) return;
    const nCliente = prompt('Nuevo Precio Cliente:', cliAct.toFixed(2));
    if(nCliente === null) return;

    const nc = Number(nCompra), ncl = Number(nCliente);
    if(isNaN(nc) || isNaN(ncl)) { alert('Valores inválidos'); return; }

    estado('ok', 'Actualizando precios...');
    try {
      await fetch(WEB_APP_URL+'?action=update&id='+encodeURIComponent(ed.dataset.edit)+'&pCompra='+nc+'&pCliente='+ncl+'&t='+Date.now());
      estado('ok', 'Precios actualizados');
      setTimeout(loadInventory, 400);
    } catch(err) { estado('err', '❌ No se pudo actualizar'); }
  }
});

searchBox.addEventListener('input', e => displayItems(e.target.value));
document.getElementById('btnReload').addEventListener('click', loadInventory);

verificarAdminUI();
mostrarFecha();
loadInventory();

setInterval(() => { if(!document.hidden) loadInventory(); }, 15000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) loadInventory(); });
</script>
</body>
</html>
